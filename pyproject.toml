[project]
name = "meshping"
version = "0.1.0"
description = "Minimal SWIM-style gossip membership with failure detection."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
